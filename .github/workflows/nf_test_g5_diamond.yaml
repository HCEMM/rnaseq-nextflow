name: Nextflow Process Test - G5 - DIAMOND

# Trigger on Pull Requests targeting developer OR main
on:
  push:
    branches:
      - diamond-g5
      - docker-test
    paths:
      - 'processes/diamond.nf'
      - 'tests/diamond.nf.test'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./containers/nf_test/Dockerfile
          tags: nf_test:latest
          outputs: type=docker,dest=/tmp/nf_test.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nf_test
          path: /tmp/nf_test.tar

  nf-test-g5:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nf_test
          path: /tmp
      - name: Load Docker image
        run: docker load --input /tmp/nf_test.tar
      - name: NF-Testing of DIAMOND process
        run: docker run --privileged -v ${{ github.workspace }}:/workspace -w /workspace nf_test:latest /bin/bash -c "nf-test test tests/diamond.nf.test"
