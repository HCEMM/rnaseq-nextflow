name: Nextflow Process Test - G1

# Trigger on Pull Requests targeting developer OR main
on:
  push:
    branches:
      - fastqc-g1
      - docker-test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./containers/nf_test/Dockerfile
          tags: upimapi:latest
          outputs: type=docker,dest=/tmp/upimapi.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upimapi
          path: /tmp/upimapi.tar

  txt-file-comma-separated:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: upimapi
          path: /tmp
      - name: Load Docker image
        run: docker load --input /tmp/upimapi.tar
